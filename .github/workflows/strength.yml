name: Сила проти Stockfish

# Сірко проти свіжого Stockfish з обмеженою силою, партії на 8 машинах паралельно.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Гілка чи коміт Сірка"
        default: "main"
      elo:
        description: "UCI_Elo для Stockfish (1320–3190)"
        default: "3190"
      games:
        description: "Партій на кожну з 8 машин"
        default: "50"
      tc:
        description: "Контроль часу (секунди+надбавка)"
        default: "8+0.08"

permissions:
  contents: read

jobs:
  match:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Збирання Сірка й завантаження Stockfish
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --break-system-packages chess==1.11.2
          git worktree add -f ../engine "origin/${REF}" 2>/dev/null || git worktree add -f ../engine "${REF}"
          (cd ../engine && cargo build --release -q)
          gh release download -R official-stockfish/Stockfish --pattern 'stockfish-ubuntu-x86-64-avx2.tar' -D ../sf
          tar -xf ../sf/stockfish-ubuntu-x86-64-avx2.tar -C ../sf
          ../sf/stockfish/stockfish-ubuntu-x86-64-avx2 quit
      - name: Матч
        env:
          ELO: ${{ inputs.elo }}
          GAMES: ${{ inputs.games }}
          TC: ${{ inputs.tc }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 tools/match.py --a ../engine/target/release/sirko --b ../sf/stockfish/stockfish-ubuntu-x86-64-avx2 \
            --b-opt UCI_LimitStrength=true --b-opt "UCI_Elo=${ELO}" \
            --games "${GAMES}" --tc "${TC}" --seed "${{ github.run_number }}${SHARD}" | tee match.txt
          grep "^\[" match.txt | tail -n 1 >"result-${SHARD}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.txt

  verdict:
    needs: match
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
      - name: Підсумок
        env:
          ELO: ${{ inputs.elo }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, math, os, re
          w = d = l = 0
          for f in glob.glob("result-*.txt"):
              m = re.search(r"\+(\d+) =(\d+) -(\d+)", open(f).read())
              if m:
                  w += int(m[1]); d += int(m[2]); l += int(m[3])
          n = w + d + l
          p = (w + d / 2) / n
          elo = -400 * math.log10(1 / p - 1) if 0 < p < 1 else float("nan")
          err = 400 / math.log(10) * 1.96 * math.sqrt(p * (1 - p) / n) / (p * (1 - p)) if 0 < p < 1 else float("nan")
          print(f"Сірко проти Stockfish {os.environ['ELO']}: +{w} ={d} -{l}, очки {100 * p:.1f}%, Elo {elo:+.0f} ± {err:.0f} ({n} партій)")
          PY
