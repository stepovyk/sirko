name: Навчання мережі

# Самогра на багатьох машинах → навчання мережі етапами → матч проти поточного Сірка.
# Щотижня запускається саме: нова самогра поточною мережею плюс свіжа самогра попередніх запусків,
# і якщо нова мережа впевнено виграла, вона сама йде в main (далі – звичайні перевірки й release).
on:
  schedule:
    - cron: "17 21 * * 6"
  workflow_dispatch:
    inputs:
      shards:
        description: "Скільки машин генерують самогру"
        default: "20"
      minutes:
        description: "Скільки хвилин самогри на машині"
        default: "320"
      nodes:
        description: "Вузлів пошуку на хід у самогрі"
        default: "5000"
      hidden:
        description: "Нейронів прихованого шару"
        default: "512"
      epochs:
        description: "Епох навчання"
        default: "10"
      games:
        description: "Партій матчу на кожну машину"
        default: "50"
      data_run:
        description: "Номер запуску, чию самогру взяти замість нової (порожньо – нова самогра)"
        default: ""
      extra_runs:
        description: "Самогра попередніх запусків: номери через пробіл, auto – найсвіжіші, порожньо – без неї"
        default: "auto"
      stage_minutes:
        description: "Хвилин від старту машини до кінця навчання на етапі (до трьох етапів)"
        default: "330"
      merge:
        description: "Якщо нова мережа впевнено виграє – самій іти в main"
        type: boolean
        default: false

concurrency:
  # Щотижневі запуски – по одному; ручні не заважають ні їм, ні одне одному.
  group: train-${{ github.event_name == 'schedule' && 'auto' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      shards: ${{ steps.s.outputs.shards }}
      minutes: ${{ steps.s.outputs.minutes }}
      nodes: ${{ steps.s.outputs.nodes }}
      hidden: ${{ steps.s.outputs.hidden }}
      epochs: ${{ steps.s.outputs.epochs }}
      games: ${{ steps.s.outputs.games }}
      match_shards: ${{ steps.s.outputs.match_shards }}
      data_run: ${{ steps.s.outputs.data_run }}
      extra_runs: ${{ steps.s.outputs.extra_runs }}
      stage_minutes: ${{ steps.s.outputs.stage_minutes }}
      merge: ${{ steps.s.outputs.merge }}
    steps:
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          SHARDS: ${{ inputs.shards }}
          MINUTES: ${{ inputs.minutes }}
          NODES: ${{ inputs.nodes }}
          HIDDEN: ${{ inputs.hidden }}
          EPOCHS: ${{ inputs.epochs }}
          GAMES: ${{ inputs.games }}
          DATA_RUN: ${{ inputs.data_run }}
          EXTRA_RUNS: ${{ inputs.extra_runs }}
          STAGE_MINUTES: ${{ inputs.stage_minutes }}
          MERGE: ${{ inputs.merge }}
        shell: python3 {0}
        run: |
          import json, os, subprocess

          env = os.environ
          auto = env["SCHEDULED"] == "true"

          def get(name, default):
              v = env.get(name, "").strip()
              return v if v and not auto else default

          # Щотижневий запуск: більший матч (16 машин по 300 партій), бо від нього залежить злиття.
          out = {
              "shards": json.dumps(list(range(min(20, int(get("SHARDS", "20")))))),
              "minutes": get("MINUTES", "320"),
              "nodes": get("NODES", "5000"),
              "hidden": get("HIDDEN", "512"),
              "epochs": get("EPOCHS", "10"),
              "games": "300" if auto else get("GAMES", "50"),
              "match_shards": json.dumps(list(range(16 if auto else 8))),
              "data_run": "" if auto else env.get("DATA_RUN", "").strip(),
              "stage_minutes": get("STAGE_MINUTES", "330"),
              "merge": "true" if auto or env.get("MERGE") == "true" else "false",
          }

          extra = "auto" if auto else env.get("EXTRA_RUNS", "").strip()
          if extra == "auto":
              # Найсвіжіша самогра попередніх запусків, поки є (артефакти живуть 30 днів),
              # стиснено до ~9,5 ГБ: разом з новою це близько мільярда позицій.
              def api(path):
                  return json.loads(subprocess.check_output(["gh", "api", f"repos/{env['REPO']}/{path}"]))

              runs = api("actions/workflows/train.yml/runs?status=success&per_page=100")["workflow_runs"]
              picked, total = [], 0
              for r in runs:
                  arts = api(f"actions/runs/{r['id']}/artifacts?per_page=100")["artifacts"]
                  size = sum(a["size_in_bytes"] for a in arts if a["name"].startswith("data-") and not a["expired"])
                  if total and total + size > 9.5e9:
                      break
                  if size:
                      picked.append(str(r["id"]))
                      total += size
              extra = " ".join(picked)
              print(f"самогра попередніх запусків: {extra or 'немає'}, {total / 1e9:.1f} ГБ стиснено")
          out["extra_runs"] = extra

          with open(env["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  print(f"{k}={v}")
                  f.write(f"{k}={v}\n")

  selfplay:
    needs: plan
    if: needs.plan.outputs.data_run == ''
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Збирання
        run: cargo build --release
      - name: Самогра
        env:
          NODES: ${{ needs.plan.outputs.nodes }}
          MINUTES: ${{ needs.plan.outputs.minutes }}
          SHARD: ${{ matrix.shard }}
        run: ./target/release/sirko datagen 1000000000 "${NODES}" "$(nproc)" "data-${SHARD}.bin" "${MINUTES}"
      - uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.shard }}
          path: data-${{ matrix.shard }}.bin
          retention-days: 30
          compression-level: 1

  # Навчання етапами до ~5,5 години (межа машини – 6): кожен наступний етап продовжує зі стану попереднього.
  # Якщо й після третього етапу епохи не скінчились, матч грає неповна мережа (з попередженням у журналі).
  train:
    needs: [plan, selfplay]
    if: always() && needs.plan.result == 'success' && (needs.selfplay.result == 'success' || needs.selfplay.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      done: ${{ steps.learn.outputs.done }}
      samples: ${{ steps.learn.outputs.samples }}
    steps: &stage
      - uses: actions/checkout@v7
      - name: Місце для даних
        # Самогра кількох запусків – десятки гігабайтів: кладемо її на більший диск машини.
        run: |
          echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
          df -h . /mnt || true
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 . | tail -1)" ]; then
            sudo mkdir -p /mnt/data
            sudo chown "$(id -u):$(id -g)" /mnt/data
            ln -s /mnt/data data
          fi
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.data_run == ''
        with:
          pattern: data-*
          path: data
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.data_run != ''
        with:
          pattern: data-*
          path: data
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.data_run }}
          github-token: ${{ github.token }}
      - name: Самогра попередніх запусків
        if: needs.plan.outputs.extra_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.plan.outputs.extra_runs }}
        run: |
          for id in ${RUNS}; do
            gh run download "${id}" -R "${GITHUB_REPOSITORY}" -p 'data-*' -D "data/extra-${id}"
            find "data/extra-${id}" -name '*.bin' | while read -r f; do mv "$f" "data/${id}-$(basename "$f")"; done
            rm -rf "data/extra-${id}"
          done
      - name: Стан попереднього етапу
        if: github.job != 'train'
        uses: actions/download-artifact@v8
        with:
          name: state
      - name: Збирання
        run: cargo build --release
      - name: Навчання
        id: learn
        # Тренер сам не починає епоху, що не встигне до межі етапу (від старту машини, разом із завантаженням).
        # Падіння тренера – помилка етапу, а не «час вичерпано».
        timeout-minutes: 350
        shell: bash
        env:
          HIDDEN: ${{ needs.plan.outputs.hidden }}
          EPOCHS: ${{ needs.plan.outputs.epochs }}
          STAGE_MINUTES: ${{ needs.plan.outputs.stage_minutes }}
        run: |
          ls -la data/
          df -h data/
          if [ "${GITHUB_JOB}" != train ] && [ ! -s train.state ]; then
            echo "::error::немає стану попереднього етапу"
            exit 1
          fi
          left=$(( STAGE_MINUTES - ($(date +%s) - JOB_START) / 60 ))
          ./target/release/sirko train sirko.nnue "${HIDDEN}" "${EPOCHS}" --batch=16384 --lr=0.001 --wdl=0.4 \
            --buckets=8 --state=train.state "--max-minutes=${left}" data/*.bin 2>&1 | tee train.log
          echo "samples=$(sed -n 's/^зразків: навчання \([0-9]*\).*/\1/p' train.log)" >>"$GITHUB_OUTPUT"
          if grep -q "^навчання завершено" train.log; then
            echo "done=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::$(grep "^час вичерпано" train.log)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: net
          path: sirko.nnue
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: state
          path: train.state
          retention-days: 7
          overwrite: true
          compression-level: 1
          if-no-files-found: error

  train2:
    needs: [plan, train]
    if: always() && needs.train.result == 'success' && needs.train.outputs.done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      done: ${{ steps.learn.outputs.done }}
    steps: *stage

  train3:
    needs: [plan, train2]
    if: always() && needs.train2.result == 'success' && needs.train2.outputs.done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      done: ${{ steps.learn.outputs.done }}
    steps: *stage

  match:
    needs: [plan, train, train2, train3]
    # Після останнього етапу – навіть неповна мережа: краще перевірити її, ніж втратити.
    if: >-
      always() && ((needs.train.result == 'success' && needs.train.outputs.done == 'true')
      || (needs.train2.result == 'success' && needs.train2.outputs.done == 'true')
      || needs.train3.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.match_shards) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: net
      - name: Матч нової мережі проти поточного Сірка
        env:
          GAMES: ${{ needs.plan.outputs.games }}
          SHARD: ${{ matrix.shard }}
        run: |
          pip install --break-system-packages chess==1.11.2
          cargo build --release
          python3 tools/match.py --a ./target/release/sirko --a-opt "EvalFile=$PWD/sirko.nnue" \
            --b ./target/release/sirko --games "${GAMES}" --tc 8+0.08 --seed "${{ github.run_number }}${SHARD}" | tee match.txt
          grep "^\[" match.txt | tail -n 1 >"result-${SHARD}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.txt

  verdict:
    needs: match
    if: always() && needs.match.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      won: ${{ steps.v.outputs.won }}
      line: ${{ steps.v.outputs.line }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          merge-multiple: true
      - name: Підсумок
        id: v
        shell: python3 {0}
        run: |
          import glob, math, os, re
          w = d = l = 0
          for f in sorted(glob.glob("result-*.txt")):
              text = open(f).read()
              print(text.strip())
              m = re.search(r"\+(\d+) =(\d+) -(\d+)", text)
              if m:
                  w += int(m[1]); d += int(m[2]); l += int(m[3])
          n = w + d + l
          p = (w + d / 2) / n
          elo = -400 * math.log10(1 / p - 1) if 0 < p < 1 else float("nan")
          err = 400 / math.log(10) * 1.96 * math.sqrt(p * (1 - p) / n) / (p * (1 - p)) if 0 < p < 1 else float("nan")
          # Імовірність, що нова мережа справді сильніша (нічиї не рахуються).
          los = 0.5 * (1 + math.erf((w - l) / math.sqrt(2 * (w + l)))) if w + l else 0.5
          line = f"+{w} ={d} -{l}, Elo {elo:+.0f} ± {err:.0f} ({n} партій)"
          summary = f"Нова мережа проти поточного Сірка: {line}, сильніша з імовірністю {100 * los:.1f}%"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"won={'true' if los >= 0.975 and n >= 2000 else 'false'}\n")
              f.write(f"line={elo:+.0f} ± {err:.0f} Elo проти попередньої ({n} партій, 8+0,08 с)\n")

  # Переможна мережа – у main: далі перевірки й release, а сервер поставить її вночі сам.
  publish:
    needs: [plan, train, verdict]
    if: always() && needs.plan.outputs.merge == 'true' && needs.verdict.outputs.won == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: net
          path: new
      - name: Мережа в main
        env:
          GH_TOKEN: ${{ github.token }}
          HIDDEN: ${{ needs.plan.outputs.hidden }}
          SAMPLES: ${{ needs.train.outputs.samples }}
          LINE: ${{ needs.verdict.outputs.line }}
        run: |
          set -euo pipefail
          cp new/sirko.nnue nets/sirko.nnue
          cargo build --release
          ./target/release/sirko bench
          millions=$(( ${SAMPLES:-0} / 1000000 ))
          row="| Мережа самонавчання $(date -u +%Y-%m-%d): ${HIDDEN} нейронів, ${millions} млн позицій | ${LINE} |"
          python3 - "$row" <<'PY'
          import sys
          s = open("README.md").read()
          mark = "\n\nМережа вбудована в рушій"
          assert s.count(mark) == 1, "у README немає місця для рядка"
          s = s.replace(mark, "\n" + sys.argv[1] + mark)
          open("README.md", "w").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Мережа самонавчання: ${LINE}"
          pushed=false
          for _ in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git pull -q --rebase origin main
          done
          "${pushed}" || { echo "::error::не вдалося запушити в main"; exit 1; }
          # Пуш від імені дії не запускає інших дій: перевірку (а з нею й release) запускаємо самі.
          gh workflow run check.yml --ref main
