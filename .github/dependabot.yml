# Щотижневі оновлення залежностей однією групою на екосистему; зливаються самі після зелених перевірок.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    labels: []
    commit-message:
      prefix: "Залежності"
    groups:
      actions:
        patterns: ["*"]
